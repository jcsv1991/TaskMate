<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskMate keeps your tasks, clients and invoices in one calm place. Built for freelancers." />
    <meta name="theme-color" content="#2457c5" />
    <title>TaskMate · Tasks, clients and invoices</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('taskmate_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
